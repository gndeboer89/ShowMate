[workspace]
resolver = "3"
members = ["crates/showmate-core", "crates/showmate-audio", "crates/showmate-video", "crates/showmate-io", "crates/showmate-app"]
# `cargo test` / `cargo build` op de root bouwen alleen de engine; de GUI bouw je met -p showmate-app.
default-members = ["crates/showmate-core", "crates/showmate-audio", "crates/showmate-video", "crates/showmate-io"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
