[package]
name = "showmate-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "showmate"
path = "src/main.rs"

[dependencies]
showmate-core = { path = "../showmate-core" }
showmate-audio = { path = "../showmate-audio" }
showmate-video = { path = "../showmate-video" }
showmate-io = { path = "../showmate-io" }
serde.workspace = true
serde_json.workspace = true
slint = { version = "1", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1"

[lints]
workspace = true

# Native bestandsdialogen (Windows). Op andere platformen zijn er stubs voor ontwikkeling/tests.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
